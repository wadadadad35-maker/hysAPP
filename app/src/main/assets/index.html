<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简 MD 笔记 - 支持音视频多媒体</title>
    
    <!-- 引入第三方解析库 -->
    <script src="marked.min.js"></script>
    
    <!-- 引入外部 CSS 样式 -->
    <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

    <!-- 主界面 -->
    <div id="main">
        <!-- 顶部标题栏 -->
        <div id="file-header">
            <button class="btn btn-subtle" id="btn-open-drawer">
                📁 目录 (<span id="total-count">0</span>)
            </button>
            <button class="btn btn-subtle" id="btn-scroll-top" title="直达顶部">⬆ 到顶部</button>
            
            <div class="header-actions">
                <div class="mode-toggle" id="mode-toggle-group">
                    <button class="mode-btn active" id="btn-mode-edit">编辑</button>
                    <button class="mode-btn" id="btn-mode-preview">预览</button>
                </div>
                <button class="btn btn-save" id="btn-save" disabled>保存</button>
                <button class="btn btn-refresh" id="btn-refresh">🔄 刷新目录</button>
                <button class="btn btn-global-search" id="btn-global-search" title="全局搜索所有笔记">🔍 全局搜索</button>
                
                <!-- 当前笔记内搜索组件 -->
                <div class="note-search-box">
                    <input type="text" id="note-search-input" placeholder="🔍 搜当前笔记...">
                    <button class="btn btn-subtle btn-search-nav" id="btn-note-search" title="搜索">🔍</button>
                    <span id="note-search-count"></span>
                    <button class="btn btn-subtle btn-search-nav" id="btn-search-prev" title="上一个">▲</button>
                    <button class="btn btn-subtle btn-search-nav" id="btn-search-next" title="下一个">▼</button>
                    <button class="btn btn-subtle btn-search-nav" id="btn-search-exit" title="退出搜索">✖</button>
                </div>
            </div>
        </div>

        <!-- 内容区容器 -->
        <div id="content-area">
            <textarea id="editor" placeholder="点击左上角“📁 目录”打开本地文件夹、新建文件或预览多媒体..." readonly></textarea>
            <div id="preview"></div>
            
            <!-- 媒体查看区 -->
            <div id="media-viewer">
                <img id="img-display" src="" alt="图片预览" style="display:none;">
                <video id="video-display" controls playsinline webkit-playsinline style="display:none;"></video>
                <div class="media-actions">
                    <button class="btn btn-subtle" id="btn-zoom-img" style="display:none;">查看大图</button>
                    <button class="btn btn-subtle" id="btn-fullscreen-landscape" style="display:none;">⛶ 横屏全屏</button>
                    <button class="btn btn-subtle" id="btn-fullscreen-portrait" style="display:none;">⛶ 竖屏全屏</button>
                    <button class="btn btn-subtle" id="btn-copy-tag">复制图片语法</button>
                </div>
            </div>

            <!-- 底部的标题与状态展示条 -->
            <div id="title-bar">
                <span id="file-title">未选择文件</span>
                <div class="title-bar-actions">
                    <button class="btn btn-subtle" id="btn-scroll-bottom" title="直达底部">⬇ 到底部</button>
                    <button class="btn btn-subtle" id="btn-copy-note-tag" style="display: none;">复制笔记语法</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 暗色半透明遮罩层 -->
    <div id="drawer-overlay"></div>

    <!-- 左侧滑动抽屉面板 -->
    <div id="bottom-sheet">
        <div class="sheet-header">
            <div class="toolbar-group">
                <!-- 打开本地文件夹按钮 -->
                <button class="btn btn-zip" id="btn-trigger-folder">📁 打开文件夹</button>
            </div>
            <button class="btn btn-subtle" id="btn-close-drawer">关闭</button>
        </div>
        
        <div id="sheet-content">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 检索文件路径/文件名...">
                <button class="btn" id="btn-search">搜索</button>
            </div>

            <div class="section-title">📄 笔记目录 (<span id="md-count">0</span>)</div>
            <ul class="file-tree" id="md-list"></ul>

            <div class="section-title">🎬 媒体资源 (<span id="media-count">0</span>)</div>
            <ul class="file-tree media-tree" id="media-list"></ul>
        </div>

        <div class="sheet-footer">
            <div class="footer-row">
                <button class="btn btn-create" id="btn-create-file">➕ 新文件</button>
                <button class="btn btn-create" id="btn-create-folder">➕ 新文件夹</button>
                <button class="btn btn-zip" id="btn-import-file">📥 导入文件</button>
            </div>
            <div class="footer-row">
                <button class="btn btn-subtle" id="btn-cut">✂️ 剪切文件/文件夹</button>
                <button class="btn btn-subtle" id="btn-paste" disabled>📋 粘贴到此目录</button>
            </div>
            <div class="footer-row">
                <button class="btn btn-subtle" id="btn-rename-file">✏️ 重命名文件</button>
                <button class="btn btn-subtle" id="btn-rename-folder">✏️ 重命名文件夹</button>
            </div>
            <div class="footer-row">
                <button class="btn btn-danger" id="btn-delete-file">🗑️ 删除文件</button>
                <button class="btn btn-danger" id="btn-delete-folder">🗑️ 删除文件夹</button>
            </div>
            <div class="footer-row">
                <button class="btn btn-subtle" id="btn-last-progress" title="跳转到当前选中文件夹上次保存的进度">📍 上次进度</button>
                <button class="btn btn-subtle" id="btn-switch-resource" title="在笔记目录与媒体资源之间切换同一文件夹">🔄 切换资源</button>
            </div>
        </div>
    </div>

    <!-- 全屏大图预览弹窗 (Lightbox) -->
    <div id="image-modal">
        <div class="modal-counter" id="modal-counter"></div>

        <!-- 顶部模式切换控件 -->
        <div class="modal-mode-switch">
            <button class="modal-mode-btn active" id="btn-modal-paged">翻页模式</button>
            <button class="modal-mode-btn" id="btn-modal-stream">流式滑动</button>
        </div>

        <span class="modal-close" id="modal-close">&times;</span>

        <!-- 单页点击翻页视图 -->
        <div id="modal-paged-view" class="modal-view">
            <img id="modal-img" src="" alt="全屏大图">
        </div>

        <!-- 流式上下滑动视图 -->
        <div id="modal-stream-view" class="modal-view" style="display: none;"></div>
    </div>

    <!-- 自定义路径输入弹窗 -->
    <div id="custom-path-modal" class="custom-modal-overlay">
        <div class="custom-modal-content">
            <div class="custom-modal-header">📂 打开本地文件夹</div>
            <div class="custom-modal-body">
                <!-- 方式一：系统文件管理器 -->
                <div class="open-folder-option">
                    <div class="open-folder-option-title">方式一：系统文件管理器</div>
                    <button type="button" class="btn btn-zip" id="btn-modal-pick-system" style="width:100%;justify-content:center;padding:10px 12px;font-size:13px;">
                        📁 用文件管理器选择文件夹
                    </button>
                    <p style="font-size:11px;color:#888;margin-top:6px;line-height:1.4;">弹出系统目录选择界面，点选后自动打开。</p>
                </div>

                <div class="open-folder-divider"><span>或</span></div>

                <!-- 方式二：手动路径 + 最近路径 -->
                <div class="open-folder-option">
                    <div class="open-folder-option-title">方式二：输入 / 常用路径</div>
                    <label for="modal-path-input">请输入手机本地文件夹绝对路径：</label>
                    <input type="text" id="modal-path-input" placeholder="例如: /sdcard/Documents/Notes">
                    
                    <div class="recent-paths-container">
                        <button type="button" class="btn btn-subtle btn-recent" id="btn-show-recent">🕒 最近路径</button>
                        <div id="recent-paths-list" class="recent-paths-list" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="custom-modal-footer">
                <button class="btn btn-subtle" id="btn-modal-cancel">取消</button>
                <button class="btn btn-create" id="btn-modal-confirm">确定打开路径</button>
            </div>
        </div>
    </div>


    <!-- 全局搜索右侧滑出面板 -->
    <div id="global-search-overlay"></div>
    <div id="global-search-panel">
        <div class="gs-header">
            <span class="gs-title">🔍 全局搜索</span>
            <button class="btn btn-subtle" id="btn-close-global-search">关闭</button>
        </div>
        <div class="gs-search-row">
            <input type="text" id="global-search-input" class="search-input" placeholder="输入关键词，搜索所有笔记..." autocomplete="off">
            <button class="btn" id="btn-do-global-search">搜索</button>
        </div>
        <div class="gs-status" id="global-search-status">输入关键词后点击搜索，将扫描全部笔记内容</div>
        <div class="gs-results" id="global-search-results"></div>
    </div>

    <!-- 隐藏的本地文件导入选择器 -->
    <input type="file" id="import-file-input" style="display: none;" multiple>

    <script src="script.js?v=18"></script>
</body>
</html>
