<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简 MD 笔记 - 支持音视频多媒体</title>
    
    <!-- 引入第三方解析库 -->
    <script src="marked.min.js"></script>
    
    <!-- 引入外部 CSS 样式 -->
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

    <!-- 主界面 -->
    <div id="main">
        <!-- 顶部标题栏 -->
        <div id="file-header">
            <button class="btn btn-subtle" id="btn-open-drawer">
                📁 目录 (<span id="total-count">0</span>)
            </button>
            <button class="btn btn-subtle" id="btn-scroll-top" title="直达顶部">⬆ 到顶部</button>
            
            <div class="header-actions">
                <div class="mode-toggle" id="mode-toggle-group">
                    <button class="mode-btn active" id="btn-mode-edit">编辑</button>
                    <button class="mode-btn" id="btn-mode-preview">预览</button>
                </div>
                <button class="btn btn-save" id="btn-save" disabled>保存</button>
                <button class="btn btn-refresh" id="btn-refresh">🔄 刷新目录</button>
                
                <!-- 🔑 当前笔记内搜索组件 -->
                <div class="note-search-box">
                    <input type="text" id="note-search-input" placeholder="🔍 搜当前笔记...">
                    <span id="note-search-count"></span>
                    <button class="btn btn-subtle btn-search-nav" id="btn-search-prev" title="上一个">▲</button>
                    <button class="btn btn-subtle btn-search-nav" id="btn-search-next" title="下一个">▼</button>
                </div>
            </div>
        </div>

        <!-- 内容区容器 -->
        <div id="content-area">
            <textarea id="editor" placeholder="点击左上角“📁 目录”打开本地文件夹、新建文件或预览多媒体..." readonly></textarea>
            <div id="preview"></div>
            
            <!-- 媒体查看区 -->
            <div id="media-viewer">
                <img id="img-display" src="" alt="图片预览" style="display:none;">
                <video id="video-display" controls style="display:none;"></video>
                <div class="media-actions">
                    <button class="btn btn-subtle" id="btn-zoom-img" style="display:none;">查看大图</button>
                    <button class="btn btn-subtle" id="btn-copy-tag">复制图片语法</button>
                </div>
            </div>

            <!-- 底部的标题与状态展示条 -->
            <div id="title-bar">
                <span id="file-title">未选择文件</span>
                <div class="title-bar-actions">
                    <button class="btn btn-subtle" id="btn-scroll-bottom" title="直达底部">⬇ 到底部</button>
                    <button class="btn btn-subtle" id="btn-copy-note-tag" style="display: none;">复制笔记语法</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 暗色半透明遮罩层 -->
    <div id="drawer-overlay"></div>

    <!-- 左侧滑动抽屉面板 -->
    <div id="bottom-sheet">
        <div class="sheet-header">
            <div class="toolbar-group">
                <!-- 打开本地文件夹按钮 -->
                <button class="btn btn-zip" id="btn-trigger-folder">📁 打开文件夹</button>
            </div>
            <button class="btn btn-subtle" id="btn-close-drawer">关闭</button>
        </div>
        
        <div id="sheet-content">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 检索文件路径/文件名...">
                <button class="btn" id="btn-search">搜索</button>
            </div>

            <div class="section-title">📄 笔记目录 (<span id="md-count">0</span>)</div>
            <ul class="file-tree" id="md-list"></ul>

            <div class="section-title">🎬 媒体资源 (<span id="media-count">0</span>)</div>
            <ul class="file-tree media-tree" id="media-list"></ul>
        </div>

        <div class="sheet-footer">
            <div class="footer-row">
                <button class="btn btn-create" id="btn-create-file">➕ 新文件</button>
                <button class="btn btn-create" id="btn-create-folder">➕ 新文件夹</button>
            </div>
            <div class="footer-row">
                <button class="btn btn-subtle" id="btn-rename-file">✏️ 重命名文件</button>
                <button class="btn btn-subtle" id="btn-rename-folder">✏️ 重命名文件夹</button>
            </div>
            <div class="footer-row">
                <button class="btn btn-danger" id="btn-delete-file">🗑️ 删除文件</button>
                <button class="btn btn-danger" id="btn-delete-folder">🗑️ 删除文件夹</button>
            </div>
        </div>
    </div>

    <!-- 全屏大图预览弹窗 (Lightbox) -->
    <div id="image-modal">
        <div class="modal-counter" id="modal-counter"></div>
        <span class="modal-close" id="modal-close">&times;</span>
        <img id="modal-img" src="" alt="全屏大图">
    </div>

    <!-- 自定义路径输入弹窗 -->
    <div id="custom-path-modal" class="custom-modal-overlay">
        <div class="custom-modal-content">
            <div class="custom-modal-header">📂 打开本地文件夹</div>
            <div class="custom-modal-body">
                <label for="modal-path-input">请输入手机本地文件夹绝对路径：</label>
                <input type="text" id="modal-path-input" placeholder="例如: /sdcard/Documents/Notes">
            </div>
            <div class="custom-modal-footer">
                <button class="btn btn-subtle" id="btn-modal-cancel">取消</button>
                <button class="btn btn-create" id="btn-modal-confirm">确定打开</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=8"></script>
</body>
</html>
